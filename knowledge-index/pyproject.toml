[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-knowledge-index"
version = "0.1.0"
description = "Local Chinese full-text and pinyin search for chat exports and meeting transcripts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jieba>=0.42.1,<1",
  "pypinyin>=0.50,<1",
]

[project.scripts]
knowledge-search = "knowledge_index.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-issue-bridge"
version = "0.1.0"
description = "Browser-driven GitHub issue bridge for local Claude execution."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
issue-bridge = "issue_bridge.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
